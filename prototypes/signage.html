<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Signboard Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app shell, fixed sidebar of sections on the left, working area on the right; collapses to a top tab strip on phones */
:root{
  --bg:#f8f8f9; --surface:#ffffff; --sunk:#f0f0f2; --ink:#16181b; --muted:#62666d; --line:#e3e4e8;
  --accent:#0d6b63; --accent-ink:#ffffff; --accent-soft:#d8ecea;
  --good:#16794a; --good-soft:#dcf1e5; --warn:#a85a07; --warn-soft:#f8ead5; --bad:#b42323; --bad-soft:#f8dddd;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-sign:"Archivo","Arial Narrow",Arial,sans-serif;
  --bar:#0a0d0c;
  --glass:rgba(255,255,255,.72); --glass-line:#e8e8ec;
  --bg-grad:linear-gradient(160deg,#ffffff 0%,#f9f9fa 55%,#efeff2 100%);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;color:var(--ink);font:14px/1.5 var(--f-ui)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:calc(100% - 60px)}
.side{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-right:1px solid var(--glass-line);padding:12px 12px 20px;display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(60px + env(safe-area-inset-top,0px));height:calc(100vh - 60px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:#3cc2b3;display:grid;place-items:center;color:#06211e;font:800 16px var(--f-sign)}
.brand b{font:700 18px var(--f-sign);letter-spacing:.01em;color:#fff}
.brand small{display:block;color:#8d9a98;font-size:11px;line-height:1.2}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 10px 4px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:7px;color:var(--ink);text-decoration:none}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a .count{font:12px var(--f-mono);color:var(--muted)}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;min-height:60px;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--bar);color:#fff;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.tenant{display:flex;align-items:center;gap:10px;min-width:0}
.tenant .av{width:32px;height:32px;border-radius:50%;background:#7a3f17;color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.tenant b{display:block;line-height:1.2;color:#fff}
.tenant span{color:#9aa8a5;font-size:12px}
.proto{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:#f0b35a;border:1px solid #4a3a1e;padding:4px 8px;border-radius:5px}
.view{padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1240px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h1{margin:0;font:700 24px/1.2 var(--f-sign);text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
a.btn{text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary,a.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.danger{color:var(--bad)}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:99px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel,.tile,.card,.plan{background:var(--glass)!important;border-color:var(--glass-line)!important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 2px rgba(16,30,28,.04),0 8px 24px rgba(16,30,28,.05)}
.plan.cur{border-color:var(--accent)!important}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);gap:8px}
.panel-h h2{margin:0;font-size:14px;font-weight:600}
.panel-b{padding:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile .k{color:var(--muted);font-size:12px}
.tile .v{font:700 28px/1.2 var(--f-sign);font-variant-numeric:tabular-nums;margin-top:4px}
.tile .s{font-size:12px;color:var(--muted)}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.full i{background:var(--warn)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.grid2>*{min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:99px;font-weight:500}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.on{color:var(--good);background:var(--good-soft)}
.pill.off{color:var(--bad);background:var(--bad-soft)}
.pill.trial{color:var(--warn);background:var(--warn-soft)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td .sub{display:block;color:var(--muted);font-size:12px}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:13px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .when{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.empty{color:var(--muted);padding:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card .meta{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.card .meta b{font-weight:600}
.card .meta span{color:var(--muted);font-size:12px}
.card .acts{display:flex;gap:6px;padding:0 12px 12px;margin-top:auto}
.kind{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.split{display:grid;grid-template-columns:260px 1fr;gap:16px}
.split>*{min-width:0}
.pl-list button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.pl-list button:last-child{border-bottom:0}
.pl-list button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.pl-list small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.pl-item{display:grid;grid-template-columns:28px 120px 1fr auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.pl-item .idx{font:500 12px var(--f-mono);color:var(--muted)}
.pl-item input{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--surface);width:100%}
.field textarea{min-height:110px;font-family:var(--f-mono);font-size:12px}
.field .hint{font-size:12px;color:var(--muted)}
.err{color:var(--bad);font-size:13px}
.form{display:grid;gap:12px}
/* week grid */
.week{display:grid;grid-template-columns:44px repeat(7,minmax(70px,1fr));min-width:620px}
.week .dh{font-size:12px;color:var(--muted);text-align:center;padding:8px 0;border-bottom:1px solid var(--line)}
.week .hours{position:relative}
.week .hours div{height:28px;font:11px var(--f-mono);color:var(--muted);text-align:right;padding-right:6px;transform:translateY(-7px)}
.week .day{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0 27px,var(--line) 27px 28px)}
.blk{position:absolute;left:3px;right:3px;border-radius:5px;padding:3px 6px;font-size:11px;line-height:1.3;overflow:hidden;color:var(--ink);border-left:3px solid}
.c0{background:color-mix(in srgb,#0d6b63 18%,var(--surface));border-color:#0d6b63}
.c1{background:color-mix(in srgb,#b8611d 18%,var(--surface));border-color:#b8611d}
.c2{background:color-mix(in srgb,#5a54b8 18%,var(--surface));border-color:#5a54b8}
.c3{background:color-mix(in srgb,#2f7ab0 18%,var(--surface));border-color:#2f7ab0}
.c4{background:color-mix(in srgb,#9a3d74 18%,var(--surface));border-color:#9a3d74}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{display:flex;align-items:center;gap:4px;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:4px 8px}
/* plans */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px}
.plan.cur{border:2px solid var(--accent)}
.plan h3{margin:0;font:700 18px var(--f-sign)}
.plan .price{font:700 30px var(--f-sign);font-variant-numeric:tabular-nums}
.plan .price small{font:400 13px var(--f-ui);color:var(--muted)}
.plan ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px}
.plan .total{font-size:13px;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
input[type=range]{width:100%;accent-color:var(--accent)}
/* modal & toast */
.scrim{position:fixed;inset:0;background:rgba(10,18,17,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:12px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(1000px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{margin:0;font:700 18px var(--f-sign)}
.modal-b{padding:20px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
.ed{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.ed>*{min-width:0}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:13px}
/* player */
.player{position:fixed;inset:0;background:#050807;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.player .stage{border-radius:6px;box-shadow:0 0 0 10px #1b1f1e,0 0 0 11px #2e3433;flex:none}
.player-bar{display:flex;gap:10px;align-items:center;color:#cfd8d6;font-size:13px;flex-wrap:wrap;justify-content:center}
.player-bar .btn{background:#1b2321;border-color:#2e3836;color:#e7efed}
.prog{width:min(100%,640px);height:3px;background:#1d2524;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#3cc2b3}

/* ===== Slides: what screens show. Fixed colors are content, not theme. ===== */
.stage{position:relative;aspect-ratio:16/9;max-width:100%;container-type:inline-size;overflow:hidden;background:#000}
.frame{aspect-ratio:16/9;background:var(--sunk);display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--line);max-width:100%}
.frame.big{aspect-ratio:4/3;border:1px solid var(--line);border-radius:8px}
.frame>.stage.tall{height:100%;width:auto}
.frame>.stage.wide{width:100%;height:auto}
.fmt{font:500 11px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;white-space:nowrap}
.sl.sl-lay{padding:0;display:grid;gap:.3cqw;background:#000}
.zone{position:relative;overflow:hidden;background:#232b2a;display:grid;place-items:center;color:#9aa8a5;font:500 2.2cqw/1.2 var(--f-ui);text-align:center;padding:1cqw;border:.25cqw dashed #4a5654}
.zone.has{border:0;padding:0;background:#000}
.zone img,.zone video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.zone.contain img,.zone.contain video{object-fit:contain}
.pickable .zone{cursor:pointer}
.pickable .zone:hover{outline:3px solid #3cc2b3;outline-offset:-3px}
.zl{position:absolute;left:1cqw;top:1cqw;background:rgba(0,0,0,.6);color:#fff;font:600 2cqw var(--f-mono);padding:.2cqw .8cqw;border-radius:.6cqw;z-index:1}
.zrow{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.zrow .zk{font:600 13px var(--f-mono);background:var(--sunk);border-radius:5px;text-align:center;padding:2px 0}
.lays{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.lays button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);align-items:center}
.lays button[aria-pressed="true"]{border:2px solid var(--accent);color:var(--ink)}
.mini{display:grid;gap:2px;width:100%;max-height:60px;margin:auto}
.mini i{background:var(--accent-soft);border:1px solid var(--accent);border-radius:2px}
.code{font:12px/1.6 var(--f-mono);background:var(--sunk);padding:12px 14px;border-radius:8px;overflow-x:auto;white-space:pre;margin:0;max-width:100%}
.code-wrap{position:relative;min-width:0}
.mth{font:600 11px var(--f-mono);padding:2px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.mth.post,.mth.put{background:var(--warn-soft);color:var(--warn)}
.st-ok{color:var(--good);font:500 12px var(--f-mono)}
.st-bad{color:var(--bad);font:500 12px var(--f-mono)}
.flash{animation:flash 1s ease-out}
@keyframes flash{from{box-shadow:0 0 0 4px #3cc2b3}to{box-shadow:0 0 0 0 transparent}}
.sl{position:absolute;inset:0;background:var(--sbg);color:var(--sfg);font-family:var(--f-sign);padding:5cqw 6cqw;display:flex;flex-direction:column}
.sl h2{font-size:6cqw;line-height:1;margin:0 0 3cqw;font-weight:800;letter-spacing:-.01em}
.sl-menu ul{list-style:none;margin:0;padding:0;columns:2;column-gap:6cqw}
.sl-menu li{display:flex;justify-content:space-between;gap:2cqw;font-size:2.9cqw;font-weight:500;padding:1.1cqw 0;border-bottom:.2cqw dotted color-mix(in srgb,var(--sfg) 40%,transparent);break-inside:avoid}
.sl-menu li b{color:var(--sac);font-weight:700}
.sl-foot{margin-top:auto;font-size:2.2cqw;opacity:.8}
.sl-promo{justify-content:center}
.sl-promo h2{font-size:9.5cqw;max-width:70%;text-wrap:balance}
.sl-promo p{font-size:3.2cqw;margin:0;font-weight:500;max-width:60%}
.sl-promo .tag{position:absolute;right:7cqw;top:50%;transform:translateY(-50%) rotate(-8deg);width:22cqw;height:22cqw;border-radius:50%;background:var(--sac);color:var(--sbg);display:grid;place-items:center;font-size:6cqw;font-weight:800}
.sl-welcome h2{font-size:7.5cqw;max-width:80%;margin-top:4cqw;text-wrap:balance}
.sl-welcome p{font-size:2.8cqw;margin:0;opacity:.85;font-family:var(--f-ui)}
.sl-strip{margin-top:auto;display:flex;gap:4cqw;align-items:baseline;border-top:.3cqw solid var(--sac);padding-top:2cqw}
.sl-strip .t{font:500 5cqw var(--f-mono)}
.sl-strip .w{font-size:2.6cqw;font-family:var(--f-ui)}
.sl-kpi .ks{display:grid;grid-template-columns:repeat(3,1fr);gap:3cqw;flex:1}
.sl-kpi .kk{background:color-mix(in srgb,var(--sfg) 6%,transparent);border-radius:1.2cqw;padding:3cqw;display:flex;flex-direction:column;gap:1cqw}
.sl-kpi .kl{font-size:2.2cqw;font-family:var(--f-ui);opacity:.75}
.sl-kpi .kv{font-size:7cqw;font-weight:800;line-height:1}
.sl-kpi .kb{margin-top:auto;height:1.2cqw;background:color-mix(in srgb,var(--sfg) 12%,transparent);border-radius:1cqw;overflow:hidden}
.sl-kpi .kb i{display:block;height:100%;background:var(--sac)}
.sl-kpi .kt{font-size:1.8cqw;font-family:var(--f-ui);opacity:.7}
.sl-news ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2cqw}
.sl-news li{font-size:3.4cqw;font-weight:600;padding-left:3cqw;border-left:.8cqw solid var(--sac);line-height:1.15}
.sl-tick{position:absolute;left:0;right:0;bottom:0;background:var(--sac);color:var(--sbg);font-size:2.4cqw;font-weight:700;padding:1.4cqw 0;white-space:nowrap;overflow:hidden}
.sl-tick span{display:inline-block;padding-left:100%;animation:tick 18s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.sl-cal .ev{display:grid;grid-template-columns:14cqw 1fr auto;gap:3cqw;align-items:baseline;padding:2cqw 0;border-bottom:.2cqw solid color-mix(in srgb,var(--sfg) 20%,transparent);font-size:3.2cqw}
.sl-cal .ev .tm{font:500 3.2cqw var(--f-mono);color:var(--sac)}
.sl-cal .ev .rm{font-size:2.4cqw;opacity:.75;font-family:var(--f-ui)}
.sl-clock{align-items:center;justify-content:center;text-align:center;gap:1cqw}
.sl-clock .big{font:500 17cqw/1 var(--f-mono);letter-spacing:-.02em}
.sl-clock .dt{font-size:3.4cqw;font-weight:700;color:var(--sac)}
.sl-clock .w{font-size:2.6cqw;font-family:var(--f-ui);opacity:.8;margin-top:2cqw}
.sl-img{padding:0}
.sl-img img{width:100%;height:100%;object-fit:cover;display:block}
@media (prefers-reduced-motion:reduce){.sl-tick span{animation:none;padding-left:3cqw}}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--glass-line);align-items:center}
  .brand small,.nav-label,.side-foot,.proto{display:none}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .nav{display:flex;gap:2px}

function slide(c){
  if(!c) return '<div class="sl" style="--sbg:#111;--sfg:#888"><p>Missing content</p></div>';
  if(c.kind==='layout') return layoutSlide(c,false);
  const d=c.d, st=`style="--sbg:${esc(d.bg)};--sfg:${esc(d.fg)};--sac:${esc(d.accent)}"`;
  switch(c.kind){
    case 'menu': return `<div class="sl sl-menu" ${st}><h2>${esc(d.title)}</h2><ul>${d.items.map(i=>`<li><span>${esc(i[0])}</span><b>${esc(i[1])}</b></li>`).join('')}</ul><div class="sl-foot">${esc(d.note)}</div></div>`;
    case 'promo': return `<div class="sl sl-promo" ${st}><h2>${esc(d.title)}</h2><p>${esc(d.sub)}</p>${d.tag?`<div class="tag">${esc(d.tag)}</div>`:''}</div>`;
    case 'welcome': return `<div class="sl sl-welcome" ${st}><h2>${esc(d.title)}</h2><p>${esc(d.sub)}</p><div class="sl-strip"><span class="t" data-clock>${hhmm()}</span><span class="w">${esc(d.weather)}</span></div></div>`;
    case 'kpi': return `<div class="sl sl-kpi" ${st}><h2>${esc(d.title)}</h2><div class="ks">${d.kpis.map(k=>`<div class="kk"><span class="kl">${esc(k[0])}</span><span class="kv">${esc(k[1])}</span><div class="kb"><i style="width:${Math.min(100,+k[2]||0)}%"></i></div><span class="kt">${esc(k[2])}% of target</span></div>`).join('')}</div></div>`;
    case 'news': return `<div class="sl sl-news" ${st}><h2>${esc(d.title)}</h2><ol>${d.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ol>${d.ticker?`<div class="sl-tick"><span>${esc(d.ticker)}</span></div>`:''}</div>`;
    case 'calendar': return `<div class="sl sl-cal" ${st}><h2>${esc(d.title)}</h2>${d.events.map(e=>`<div class="ev"><span class="tm">${esc(e[0])}</span><span>${esc(e[1])}</span><span class="rm">${esc(e[2])}</span></div>`).join('')}</div>`;
    case 'clock': return `<div class="sl sl-clock" ${st}><div class="big" data-clock>${hhmm()}</div><div class="dt" data-date>${today()}</div><div class="w">${esc(d.city)} · ${esc(d.weather)}</div></div>`;
    case 'image': return `<div class="sl sl-img" style="--sbg:#000;--sfg:#fff"><img src="${d.src}" alt="${esc(c.name)}"></div>`;
    case 'layout': return layoutSlide(c,false);
  }
}

/* ---------- shell ---------- */
let cur='dashboard';
function nav(){
  const item=k=>`<a href="#${k}" ${k===cur?'aria-current="page"':''}>${VIEWS[k].label}${VIEWS[k].count?`<span class="count">${VIEWS[k].count()}</span>`:''}</a>`;
  const main=Object.keys(VIEWS).filter(k=>!VIEWS[k].admin), adm=Object.keys(VIEWS).filter(k=>VIEWS[k].admin);
  $('#nav').innerHTML=`<div class="nav-label">Harbor Coffee Co.</div>${main.map(item).join('')}<div class="nav-label">Platform admin</div>${adm.map(item).join('')}`;
  $('#tPlan').textContent=`${PLANS[S.tenant.plan].name} plan · ${S.screens.length} of ${S.tenant.limit} screens`;
}
function render(){const y=window.scrollY;$('#view').innerHTML=VIEWS[cur].render();nav();bind();window.scrollTo(0,y);}
function go(){const h=location.hash.slice(1);cur=VIEWS[h]?h:'dashboard';if(cur!=='api'&&VIEWS.api.timer){clearInterval(VIEWS.api.timer);VIEWS.api.timer=null;}VIEWS[cur].render&&render();window.scrollTo(0,0);}
window.addEventListener('hashchange',go);

function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600);}
function modal(html,wide){
  $('#layer').innerHTML=`<div class="scrim" data-close><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const f=$('#layer input,#layer select,#layer textarea');f&&f.focus();
}
function closeModal(){$('#layer').innerHTML='';}
$('#layer').addEventListener('click',e=>{if(e.target.hasAttribute('data-close')||e.target.closest('[data-x]'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(player)stopPlayer();else closeModal();}});

/* ---------- actions ---------- */
function bind(){
  const up=$('#up'); if(up) up.onchange=()=>{const f=up.files[0];if(!f)return;const v=f.type.startsWith('video');
    const c={id:null,name:f.name.replace(/\.[^.]+$/,''),kind:'layout',fmt:'land',lay:'full',dur:v?20:10,zones:{a:Z(URL.createObjectURL(f),v?'video':'image')}};up.value='';layoutEditor(c);};
  if(cur==='api') apiBind();
  const pn=$('#plname'); if(pn) pn.onchange=()=>{P(VIEWS.playlists.sel).name=pn.value.trim()||'Untitled playlist';render();};
  const rf=$('#ruleform'); if(rf) rf.onsubmit=e=>{e.preventDefault();const days=[...rf.querySelectorAll('[name=rd]:checked')].map(i=>+i.value),s=+$('#rs').value,en=+$('#re').value;
    const er=$('#rerr');if(!days.length){er.textContent='Pick at least one day.';er.hidden=false;return;}if(en<=s){er.textContent='The end time must be after the start time.';er.hidden=false;return;}
    const g=VIEWS.schedules.g, clash=S.schedules.find(r=>r.group===g&&r.days.some(d=>days.includes(d))&&s<r.end&&en>r.start);
    if(clash){er.textContent=`This overlaps ${P(clash.pl).name} (${clash.start}:00 to ${clash.end}:00). Change the times or remove that rule first.`;er.hidden=false;return;}
    S.schedules.push({id:nid('r'),group:g,pl:$('#rpl').value,days,start:s,end:en});render();toast('Rule added');};
  const ns=$('#nscr'); if(ns) ns.oninput=()=>{VIEWS.billing.n=+ns.value;render();$('#nscr').focus();};
}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='setpl'){S.screens.find(s=>s.id===t.dataset.s).pl=t.value;render();toast('Default playlist changed');}
  if(t.dataset.act==='dur'){P(VIEWS.playlists.sel).items[+t.dataset.i].dur=Math.max(3,+t.value||3);render();}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.tagName==='SELECT'||b.tagName==='INPUT')return;
  const a=b.dataset.act, pl=P(VIEWS.playlists.sel);
  const A={
    sf:()=>{VIEWS.screens.f=b.dataset.v;render();},
    sg:()=>{VIEWS.schedules.g=b.dataset.v;render();},
    tf:()=>{VIEWS.templates.f=b.dataset.v;render();},
    pair:pairDialog,
    unpair:()=>{const s=S.screens.find(x=>x.id===b.dataset.s);S.screens=S.screens.filter(x=>x!==s);render();toast(`${s.name} removed. One screen freed on your plan.`);},
    preview:()=>{const s=S.screens.find(x=>x.id===b.dataset.s);startPlayer(P(nowPl(s)),s.name);},
    selpl:()=>{VIEWS.playlists.sel=b.dataset.p;render();},
    newpl:()=>{const p={id:nid('p'),name:'New playlist',items:[]};S.playlists.push(p);VIEWS.playlists.sel=p.id;render();$('#plname').select();},
    additem:()=>{const c=C($('#addc').value);pl.items.push({c:c.id,dur:c.dur});render();},
    rmit:()=>{pl.items.splice(+b.dataset.i,1);render();},
    mv:()=>{const i=+b.dataset.i,j=i+ +b.dataset.d;[pl.items[i],pl.items[j]]=[pl.items[j],pl.items[i]];render();},
    playpl:()=>pl.items.length?startPlayer(pl,'Preview'):toast('Add content to this playlist first'),
    play1:()=>startPlayer({name:C(b.dataset.c).name,items:[{c:b.dataset.c,dur:C(b.dataset.c).dur}]},'Preview'),
    delc:()=>{const id=b.dataset.c,n=plUse(id);if(n){toast(`Remove it from ${n} playlist${n>1?'s':''} first`);return;}S.content=S.content.filter(c=>c.id!==id);render();toast('Deleted');},
    edit:()=>{const c=C(b.dataset.c);c.kind==='layout'?layoutEditor(c):editor(c);},
    lf:()=>{VIEWS.templates.lf=b.dataset.v;render();},
    uselay:()=>layoutEditor({id:null,name:FORMATS[b.dataset.f].n+' · '+LAY(b.dataset.f,b.dataset.l).n,kind:'layout',fmt:b.dataset.f,lay:b.dataset.l,dur:10,zones:{}}),
    usetpl:()=>{const t=TEMPLATES[+b.dataset.t];editor({id:null,name:t.name,kind:t.kind,dur:12,d:JSON.parse(JSON.stringify(t.d))});},
    delr:()=>{S.schedules=S.schedules.filter(r=>r.id!==b.dataset.r);render();toast('Rule removed');},
    plan:()=>{const k=b.dataset.k,n=VIEWS.billing.n??S.tenant.limit;if(n<S.screens.length){toast(`You have ${S.screens.length} paired screens. Remove some first, or choose at least ${S.screens.length}.`);return;}S.tenant.plan=k;S.tenant.limit=n;render();toast(`Switched to ${PLANS[k].name} with ${n} screens`);},
    toast:()=>toast(b.dataset.m),
    apisend:()=>apiPush($('#apibody').value,'sent from this page'),
    apiauto:apiAuto,
    copykey:()=>{try{navigator.clipboard.writeText('sk_live_hc_example_key_7Q2M').then(()=>toast('Example key copied'),()=>toast('Copy is blocked here. Select the key instead.'));}catch(e){toast('Copy is blocked here. Select the key instead.');}}
  };
  A[a]&&A[a]();
});

function pairDialog(){
  const full=S.screens.length>=S.tenant.limit;
  if(full){modal(`<div class="modal-h"><h2>Your plan is full</h2><button class="btn ghost" data-x aria-label="Close">✕</button></div><div class="modal-b"><p style="margin:0">You are using all ${S.tenant.limit} screens on your ${PLANS[S.tenant.plan].name} plan. Add more screens to your plan to pair this one.</p></div><div class="modal-f"><button class="btn" data-x>Not now</button><a class="btn primary" href="#billing" data-x>Add screens</a></div>`);return;}
  modal(`<div class="modal-h"><h2>Pair a screen</h2><button class="btn ghost" data-x aria-label="Close">✕</button></div>
  <form id="pf"><div class="modal-b form">
    <p style="margin:0;color:var(--muted)">Open the player app on the TV. It shows a 6-character code. For this prototype, any 6 letters or numbers will work.</p>
    <div class="field"><label for="pcode">Pairing code</label><input id="pcode" maxlength="6" autocomplete="off" placeholder="e.g. K7Q2MX" style="font:500 20px var(--f-mono);letter-spacing:.2em;text-transform:uppercase"></div>
    <div class="field"><label for="pname">Screen name</label><input id="pname" placeholder="e.g. Drive-through menu"></div>
    <div class="row"><div class="field" style="flex:1;min-width:140px"><label for="pgroup">Group</label><select id="pgroup">${S.groups.map(g=>`<option>${esc(g)}</option>`).join('')}</select></div>
    <div class="field" style="flex:1;min-width:140px"><label for="psite">Site</label><select id="psite"><option>Pier St</option><option>Old Town</option></select></div></div>
    <div class="field"><label for="pfmt">Screen size and orientation</label><select id="pfmt">${Object.entries(FORMATS).map(([k,x])=>`<option value="${k}">${x.n} · ${x.px}</option>`).join('')}</select><span class="hint">The player detects this automatically in the real product.</span></div>
    <div class="field"><label for="ppl">Default playlist</label><select id="ppl">${S.playlists.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
    <p class="err" id="perr" hidden></p>
    <p style="margin:0;font-size:12px;color:var(--muted)">This uses 1 of your ${S.tenant.limit - S.screens.length} free screens.</p>
  </div><div class="modal-f"><button type="button" class="btn" data-x>Cancel</button><button class="btn primary" type="submit">Pair screen</button></div></form>`);
  $('#pf').onsubmit=e=>{e.preventDefault();const code=$('#pcode').value.trim(),name=$('#pname').value.trim(),er=$('#perr');
    if(!/^[a-z0-9]{6}$/i.test(code)){er.textContent='Enter the 6-character code shown on the TV.';er.hidden=false;return;}
    if(!name){er.textContent='Give the screen a name so your team can find it.';er.hidden=false;return;}
    S.screens.push({id:nid('s'),name,group:$('#pgroup').value,site:$('#psite').value,status:'on',seen:'just now',pl:$('#ppl').value,fmt:$('#pfmt').value});
    S.activity.unshift(['Maya Cruz','paired '+name,'just now']);closeModal();render();toast(`${name} is paired and playing`);};
}

function editor(c){
  const fields=FIELDS[c.kind], d=c.d;
  const val=f=>{const v=d[f[0]];if(f[2]==='lines')return v.map(x=>Array.isArray(x)?x.join(' | '):x).join('\n');return v??'';};
  modal(`<div class="modal-h"><h2>${c.id?'Edit':'New'}: ${esc(c.name)}</h2><button class="btn ghost" data-x aria-label="Close">✕</button></div>
  <div class="modal-b ed"><form class="form" id="ef">
    <div class="field"><label for="ename">Name in your library</label><input id="ename" value="${esc(c.name)}"></div>
    ${fields.map(f=>`<div class="field"><label for="f_${f[0]}">${esc(f[1])}</label>${f[2]==='lines'?`<textarea id="f_${f[0]}" data-k="${f[0]}" data-n="${f[3]}">${esc(val(f))}</textarea>`:`<input id="f_${f[0]}" data-k="${f[0]}" value="${esc(val(f))}">`}</div>`).join('')}
    <div class="row">${[['bg','Background'],['fg','Text'],['accent','Accent']].map(([k,l])=>`<div class="field"><label for="f_${k}">${l}</label><input type="color" id="f_${k}" data-k="${k}" value="${esc(d[k])}" style="height:36px;padding:2px;width:72px"></div>`).join('')}
      <div class="field"><label for="edur">Seconds</label><input id="edur" type="number" min="3" value="${c.dur}" style="width:80px"></div></div>
  </form><div><div id="eprev" style="border-radius:8px;overflow:hidden">${stage(c)}</div><p style="color:var(--muted);font-size:12px">Live preview at TV proportions (16:9).</p></div></div>
  <div class="modal-f"><button class="btn" data-x>Cancel</button><button class="btn primary" id="esave">${c.id?'Save changes':'Add to library'}</button></div>`,true);
  const read=()=>{document.querySelectorAll('#ef [data-k]').forEach(i=>{const k=i.dataset.k;if(i.tagName==='TEXTAREA'){const n=+i.dataset.n;d[k]=i.value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>n>1?Array.from({length:n},(_,j)=>(l.split('|')[j]||'').trim()):l);}else d[k]=i.value;});};
  $('#ef').oninput=()=>{read();$('#eprev').innerHTML=stage(c);};
  $('#ef').onsubmit=e=>e.preventDefault();
  $('#esave').onclick=()=>{read();c.name=$('#ename').value.trim()||c.name;c.dur=Math.max(3,+$('#edur').value||10);
    if(!c.id){c.id=nid('c');S.content.unshift(c);closeModal();location.hash='content';if(cur==='content')render();toast('Added to your content library');}
    else{closeModal();render();toast('Saved. Screens playing it update within seconds.');}};
}

/* ---------- media layout editor ---------- */
function layoutEditor(orig){
  const c={...orig,zones:{...orig.zones}}; let target=null;
  modal(`<div class="modal-h"><h2>${orig.id?'Edit':'New'} media layout</h2><button class="btn ghost" data-x aria-label="Close">✕</button></div>
  <div class="modal-b ed" id="led"><div class="form">
    <div class="field"><label for="lname">Name in your library</label><input id="lname" value="${esc(c.name)}"></div>
    <div class="field"><label for="lfmt">Screen size</label><select id="lfmt">${Object.entries(FORMATS).map(([k,x])=>`<option value="${k}" ${k===c.fmt?'selected':''}>${x.n} · ${x.px}</option>`).join('')}</select></div>
    <div class="field"><label>Layout</label><div class="lays" id="llays"></div></div>
    <div class="field"><label>Zones</label><div id="lzones"></div></div>
    <div class="field"><label for="ldur">Seconds on screen</label><input id="ldur" type="number" min="3" value="${c.dur}" style="width:90px"></div>
    <p class="err" id="lerr" hidden></p>
  </div><div><div id="lprev"></div><p style="color:var(--muted);font-size:12px">Click a zone to upload into it. Images and video both work; video plays muted and loops.</p></div></div>
  <input type="file" id="lfile" accept="image/*,video/*" hidden>
  <div class="modal-f"><button class="btn" data-x>Cancel</button><button class="btn primary" id="lsave">${orig.id?'Save changes':'Add to library'}</button></div>`,true);
  const draw=()=>{
    const l=LAY(c.fmt,c.lay), [w,h]=FORMATS[c.fmt].r;
    $('#llays').innerHTML=LAYOUTS[c.fmt].map(x=>`<button type="button" aria-pressed="${x.id===l.id}" data-lay="${x.id}"><span class="mini" style="grid-template-columns:${x.c};grid-template-rows:${x.r};grid-template-areas:${x.a.replace(/"/g,"'")};aspect-ratio:${w}/${h};${w>=h?'width:100%':'height:52px;width:auto'}">${zonesOf(x).map(z=>`<i style="grid-area:${z}"></i>`).join('')}</span>${esc(x.n)}</button>`).join('');
    $('#lzones').innerHTML=zonesOf(l).map(z=>{const m=c.zones[z];return `<div class="zrow"><span class="zk">${z.toUpperCase()}</span><div class="row"><button type="button" class="btn sm" data-up="${z}">${m?'Replace':'Upload'}</button>${m?`<span style="color:var(--muted);font-size:12px">${m.type==='video'?'Video':'Image'}</span><select aria-label="Fit for zone ${z.toUpperCase()}" data-fit="${z}" style="border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--surface);font-size:12px"><option value="cover" ${m.fit!=='contain'?'selected':''}>Fill zone</option><option value="contain" ${m.fit==='contain'?'selected':''}>Fit whole picture</option></select><button type="button" class="btn sm ghost danger" data-clr="${z}">Clear</button>`:'<span style="color:var(--muted);font-size:12px">Empty</span>'}</div></div>`}).join('');
    $('#lprev').innerHTML=`<div class="frame big"><div class="stage pickable ${ratio(c.fmt)<4/3?'tall':'wide'}" style="aspect-ratio:${w}/${h}">${layoutSlide(c,true)}</div></div>`;
  };
  draw();
  const root=$('#layer .modal');
  root.addEventListener('click',e=>{
    const t=e.target.closest('[data-lay],[data-up],[data-clr],.zone');if(!t)return;
    if(t.dataset.lay){c.lay=t.dataset.lay;draw();}
    else if(t.dataset.clr){delete c.zones[t.dataset.clr];draw();}
    else{target=t.dataset.up||t.dataset.z;$('#lfile').click();}
  });
  root.addEventListener('change',e=>{
    if(e.target.id==='lfmt'){c.fmt=e.target.value;c.lay=LAYOUTS[c.fmt][0].id;draw();}
    if(e.target.dataset.fit){c.zones[e.target.dataset.fit].fit=e.target.value;draw();}
    if(e.target.id==='lfile'){const f=e.target.files[0];if(f&&target){c.zones[target]=Z(URL.createObjectURL(f),f.type.startsWith('video')?'video':'image');draw();}e.target.value='';}
  });
  $('#lsave').onclick=()=>{
    const l=LAY(c.fmt,c.lay), used=zonesOf(l).filter(z=>c.zones[z]);
    if(!used.length){const er=$('#lerr');er.textContent='Add an image or video to at least one zone.';er.hidden=false;return;}
    c.zones=Object.fromEntries(used.map(z=>[z,c.zones[z]]));c.name=$('#lname').value.trim()||c.name;c.dur=Math.max(3,+$('#ldur').value||10);
    if(orig.id){Object.assign(orig,c);closeModal();render();toast('Saved. Screens playing it update within seconds.');}
    else{c.id=nid('c');S.content.unshift(c);closeModal();if(cur==='content')render();else location.hash='content';toast('Added to your content library');}
  };
}

/* ---------- API demo ---------- */
const API_BASE='https://api.signboard.example/v1';
const apiLog=()=>S.apilog.slice(0,6).map(l=>`<li><span class="mth ${l[1].toLowerCase()}">${l[1]}</span><span style="min-width:0"><span class="num" style="font-size:12px;word-break:break-all">${esc(l[2])}</span>${l[4]?`<span style="display:block;color:var(--muted);font-size:12px">${esc(l[4])}</span>`:''}</span><span class="when"><span class="${l[3]<300?'st-ok':'st-bad'}">${l[3]}</span> · ${l[0]}</span></li>`).join('');
function apiCurl(){const el=$('#apicurl');if(!el)return;let body=VIEWS.api.body;try{body=JSON.stringify(JSON.parse(body));}catch(e){}
  el.textContent=`curl -X POST ${API_BASE}/feeds/store-kpis \\\n  -H "Authorization: Bearer $SIGNBOARD_KEY" \\\n  -H "Content-Type: application/json" \\\n  -d '${body}'`;}
function apiBind(){
  const t=$('#apibody');if(t)t.oninput=()=>{VIEWS.api.body=t.value;apiCurl();};
  const s=$('#apiscr');if(s)s.onchange=()=>{VIEWS.api.s=s.value;S.apilog.unshift([new Date().toLocaleTimeString([], {hour12:false}),'GET',`/v1/screens/${s.value}/now-playing`,200,'']);render();};
  apiCurl();
}
function apiPush(text,note){
  const time=new Date().toLocaleTimeString([], {hour12:false}), er=$('#apierr');
  let data;try{data=JSON.parse(text);if(!data||typeof data!=='object'||Array.isArray(data))throw new Error('The body must be a JSON object');}
  catch(e){S.apilog.unshift([time,'POST','/v1/feeds/store-kpis',400,'Invalid JSON: '+e.message]);if(er){er.textContent='That is not valid JSON. '+e.message;er.hidden=false;}const lg=$('#apilog');if(lg)lg.innerHTML=apiLog();return;}
  if(er)er.hidden=true;
  const c=C(S.feeds['store-kpis']), skipped=[];
  Object.entries(data).forEach(([k,v])=>{const kp=c.d.kpis.find(x=>x[0].toLowerCase()===k.toLowerCase());if(!kp){skipped.push(k);return;}
    if(v&&typeof v==='object'){if(v.value!=null)kp[1]=String(v.value);if(v.progress!=null)kp[2]=String(Math.max(0,Math.min(100,+v.progress||0)));}else kp[1]=String(v);});
  S.apilog.unshift([time,'POST','/v1/feeds/store-kpis',200,[note,skipped.length?'ignored unknown keys: '+skipped.join(', '):''].filter(Boolean).join(' · ')]);
  const st=$('#apistage');if(st){st.innerHTML=stage(c);st.classList.remove('flash');void st.offsetWidth;st.classList.add('flash');}
  const lg=$('#apilog');if(lg)lg.innerHTML=apiLog();
  if(player&&player.pl.items[player.i]?.c===c.id)$('#pst').innerHTML=slide(c);
}
function apiAuto(){
  const A=VIEWS.api;
  if(A.timer){clearInterval(A.timer);A.timer=null;render();return;}
  const step=()=>{const k=C('c4').d.kpis, orders=(parseInt(k[0][1])||400)+1+Math.floor(Math.random()*4), wait=150+Math.floor(Math.random()*120);
    A.body=JSON.stringify({'Orders':{value:String(orders),progress:Math.min(100,Math.round(orders/550*100))},'Average wait':{value:`${Math.floor(wait/60)}m ${String(wait%60).padStart(2,'0')}s`,progress:Math.round(100-wait/4)},'Rating':(4.6+Math.random()*.4).toFixed(1)},null,2);
    const t=$('#apibody');if(t)t.value=A.body;apiCurl();apiPush(A.body,'from till system');};
  A.timer=setInterval(step,3000);render();step();
}

/* ---------- player preview ---------- */
let player=null;
function startPlayer(pl,label){
  if(!pl||!pl.items.length){toast('Nothing scheduled to play');return;}
  stopPlayer();
  const el=document.createElement('div');el.className='player';el.setAttribute('role','dialog');el.setAttribute('aria-label','Player preview');
  el.innerHTML=`<div class="stage" id="pst"></div><div class="prog"><i id="ppg"></i></div><div class="player-bar"><span id="pinfo"></span><button class="btn sm" id="pprev">Previous</button><button class="btn sm" id="ppause">Pause</button><button class="btn sm" id="pnext">Next</button><button class="btn sm" id="pclose">Close</button></div>`;
  document.body.append(el);
  player={el,pl,label,i:0,t:0,paused:false,last:performance.now()};
  const show=()=>{const it=pl.items[player.i],c=C(it.c),f=fmtOf(c),w=Math.max(160,Math.min(innerWidth-48,(innerHeight-130)*ratio(f)));
    const ps=$('#pst');ps.style.aspectRatio=FORMATS[f].r.join('/');ps.style.width=w+'px';$('.prog').style.width=Math.min(w,innerWidth-32)+'px';ps.innerHTML=slide(c);$('#pinfo').textContent=`${label} · ${pl.name} · item ${player.i+1} of ${pl.items.length} · ${it.dur}s`;player.t=0;};
  player.show=show;show();
  $('#pnext').onclick=()=>{player.i=(player.i+1)%pl.items.length;show();};
  $('#pprev').onclick=()=>{player.i=(player.i-1+pl.items.length)%pl.items.length;show();};
  $('#ppause').onclick=e=>{player.paused=!player.paused;e.target.textContent=player.paused?'Play':'Pause';};
  $('#pclose').onclick=stopPlayer;
  const tick=now=>{if(!player)return;const dt=(now-player.last)/1000;player.last=now;if(!player.paused){player.t+=dt;const it=pl.items[player.i];$('#ppg').style.width=Math.min(100,player.t/it.dur*100)+'%';if(player.t>=it.dur){player.i=(player.i+1)%pl.items.length;show();}}player.raf=requestAnimationFrame(tick);};
  player.raf=requestAnimationFrame(tick);
  $('#pclose').focus();
}
function stopPlayer(){if(!player)return;cancelAnimationFrame(player.raf);player.el.remove();player=null;}

go();
</script>
